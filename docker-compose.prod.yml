name: outreach-desk

x-app: &app
  image: outreach-desk-app:${OUTREACH_IMAGE_TAG:-local}
  env_file:
    - ${OUTREACH_ENV_FILE:-/root/outreach/.env}
    - ${OUTREACH_RUNTIME_ENV_FILE:-/root/outreach/storage/runtime.env}
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-outreach}:${POSTGRES_PASSWORD:-outreach}@postgres:5432/${POSTGRES_DB:-outreach}
    OUTREACH_SECRETS_FILE: /app/storage/runtime.env
  volumes:
    - type: bind
      source: ${OUTREACH_STORAGE_DIR:-/root/outreach/storage}
      target: /app/storage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outreach}
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach} -d ${POSTGRES_DB:-outreach}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["node", "src/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: .
    command: ["node", "src/server.js"]
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *app
    command: ["node", "src/worker/index.js"]
    restart: unless-stopped
    profiles: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
